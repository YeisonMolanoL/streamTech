<div class="card p-3">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="d-flex justify-content-between">
                <h5 class="modal-title" id="modalNewClientLabel">Nueva cuenta</h5>
                <button type="button" class="btn-close" aria-label="Close" (click)="dialogRef.close()"></button>
            </div>
            <div class="modal-body">
                <div class="container">
                    <form [formGroup]="clientForm">
                        <div class="p-2 input-with-icon">
                            <input type="text" placeholder="Nombre cliente" formControlName="clientName" />
                        </div>
                        <small class="error-message" *ngIf="clientForm.get('clientName')?.invalid && clientForm.get('clientName')?.touched">Este campo es obligatorio*</small>
                        
                        <div class="p-2 input-with-icon my-2">
                            <input type="text" placeholder="Contacto cliente" formControlName="clientNumber" />
                        </div>
                        <small class="error-message" *ngIf="clientForm.get('clientNumber')?.invalid && clientForm.get('clientNumber')?.touched">Este campo es obligatorio*</small>
                    </form>
                </div>
            </div>
            <div class="modal-footer">
                <button nbButton type="button" status="primary" (click)="createClient()"
                    [disabled]="isLoading" [nbSpinner]="isLoading" nbSpinnerStatus="success">
                    Crear
                </button>
            </div>
        </div>
    </div>
</div>
