<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <h1>Iniciar Sesión</h1>
  <nb-form-field class="w-100">
    <input
      nbInput
      class="m-1"
      type="email"
      formControlName="userName"
      fullWidth
      placeholder="Correo electrónico"
    />
    <span
      *ngIf="
        loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched
      "
      class="error-message"
    >
      Este campo es obligatorio*
    </span>
  </nb-form-field>
  <nb-form-field class="w-100">
    <input
      nbInput
      class="m-1"
      [type]="getInputType()"
      formControlName="password"
      fullWidth
      placeholder="Contraseña"
    />
    <button nbSuffix nbButton ghost type="button" (click)="toggleShowPassword()">
      <nb-icon
        [icon]="showPassword ? 'eye-outline' : 'eye-off-2-outline'"
        pack="eva"
        [attr.aria-label]="showPassword ? 'hide password' : 'show password'"
      >
      </nb-icon>
    </button>
  </nb-form-field>
  <span
    *ngIf="
      loginForm.get('password')?.invalid && loginForm.get('password')?.touched
    "
    class="error-message"
  >
    Este campo es obligatorio*
  </span>
  <div class="mt-3 w-100">
    <button nbButton outline type="submit" status="primary" class="w-100" [disabled]="isLoading" [nbSpinner]="isLoading" nbSpinnerStatus="success">
      Iniciar Sesión
    </button>
  </div>
  <span class="error-message">{{ errorMessage$ | async }}</span>
  <div>
    <span class="mt-4" style="cursor: pointer; border-bottom: 1px solid blue">
      <p class="p-0 m-0" style="font-size: 12px; color: blue">
        ¡He olvidado mi contraseña!
      </p>
    </span>
  </div>
</form>
